services:
  - type: web
    name: yt-converter-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production

      # Refresh yt-dlp on every cold start. Set to 0 only to pin the build.
      - key: YTDLP_AUTO_UPDATE
        value: "1"

      # Player clients tried in order, "|" separated, until one returns data.
      # default/tv_embedded/web_embedded all give full 1080p; the android
      # variants cap at 360p and exist only as a last resort.
      - key: YTDLP_CLIENTS
        value: "default|tv_embedded|web_embedded|android_vr|android,web"

      # Optional. Paste a Netscape-format cookies.txt here if YouTube starts
      # bot-checking this server. Left unset by default -- see README.
      - key: YOUTUBE_COOKIES
        sync: false
