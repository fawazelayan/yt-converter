name: Keep backend awake

# Render's free tier spins a service down after 15 minutes of inactivity, and
# the next request pays a ~50 second cold start -- which reads as "the site is
# broken" to anyone who is not the developer.
#
# The catch: Render grants 750 free instance hours per WORKSPACE per month and
# suspends every free service until the next month once that runs out. A truly
# always-on service burns ~744 h in a 31-day month, leaving about six hours of
# headroom -- so a single redeploy or a second free service would get the whole
# workspace suspended, most likely late in the month.
#
# So we keep it warm only across waking hours: 05:00-21:59 UTC is 08:00-00:59
# local (UTC+3), about 527 h/month. That leaves >200 h of headroom, and the only
# cost is a one-minute wake-up if someone opens the site overnight -- which the
# frontend already handles by waiting and showing "Waking server...".

on:
  schedule:
    - cron: "*/10 5-21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the backend health endpoint
        run: |
          BACKEND="${{ vars.BACKEND_URL }}"
          if [ -z "$BACKEND" ]; then
            BACKEND="https://yt-converter-backend-hw8r.onrender.com"
          fi
          echo "Pinging $BACKEND/api/status"

          # A cold start can take ~50s, so allow a generous timeout and retry
          # rather than failing the run the moment the instance is still waking.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/body.json -w "%{http_code}" \
              --max-time 120 "$BACKEND/api/status") || code=000
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/body.json
              echo
              exit 0
            fi
            sleep 15
          done

          echo "Backend did not return HTTP 200 after 3 attempts."
          exit 1
