<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>YT Downloader</title>
  <meta name="description" content="Paste a YouTube link and save it as audio or video. Trim to a clip first if you want.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=DEV">
</head>
<body>
  <!-- Icon sprite: one stroke weight, one grid, one system -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M9.5 13.5a4 4 0 0 0 5.9.4l2.4-2.4a4 4 0 0 0-5.7-5.7l-1.4 1.4"/><path d="M13.5 9.5a4 4 0 0 0-5.9-.4l-2.4 2.4a4 4 0 0 0 5.7 5.7l1.4-1.4"/></symbol>
      <symbol id="i-clipboard" viewBox="0 0 24 24"><path d="M14 4h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="9" y="2.5" width="6" height="3.5" rx="1"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l11 11M17 6L6 17"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M4.5 15.5V18a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2.5"/><path d="M8 11.5l4 4 4-4"/><path d="M12 4v11.5"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5.5l11 6.5-11 6.5z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5.5v13M15 5.5v13"/></symbol>
      <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></symbol>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5.5" width="13" height="13" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3z"/></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="M5 9.5h3l4-3.5v12l-4-3.5H5z"/><path d="M15.5 9a4 4 0 0 1 0 6"/></symbol>
      <symbol id="i-muted" viewBox="0 0 24 24"><path d="M5 9.5h3l4-3.5v12l-4-3.5H5z"/><path d="M16 9.5l4 5M20 9.5l-4 5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5l8.5 15h-17z"/><path d="M12 10v4"/><path d="M12 16.6v.1"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.2l3.2 2"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4.5 10.5a8 8 0 1 1 .6 5"/><path d="M4 5.5v5h5"/></symbol>
    </defs>
  </svg>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <div class="shell">
    <header class="masthead">
      <a class="wordmark" href="/">
        <span class="wordmark-mark" aria-hidden="true"></span>
        YT Downloader
      </a>
      <p class="server-state" id="serverState" data-state="checking">
        <span class="server-dot" aria-hidden="true"></span>
        <span id="serverStateText">Connecting</span>
      </p>
    </header>

    <main>
      <section class="intake">
        <h1 class="intake-title"><label for="urlInput">Paste a YouTube link</label></h1>

        <form class="intake-form" id="urlForm">
          <div class="field">
            <svg class="field-icon" aria-hidden="true"><use href="#i-link"/></svg>
            <input
              type="url"
              id="urlInput"
              name="url"
              placeholder="youtube.com/watch?v=… or a Shorts link"
              autocomplete="off"
              spellcheck="false"
              required
            />
            <button type="button" id="clearBtn" class="field-btn is-hidden" title="Clear">
              <svg aria-hidden="true"><use href="#i-x"/></svg>
              <span class="sr-only">Clear the link</span>
            </button>
            <button type="button" id="pasteBtn" class="field-btn" title="Paste from clipboard">
              <svg aria-hidden="true"><use href="#i-clipboard"/></svg>
              <span class="sr-only">Paste from clipboard</span>
            </button>
          </div>
          <button type="submit" id="fetchBtn" class="btn btn-solid">
            <span id="fetchBtnText">Find it</span>
          </button>
        </form>
      </section>

      <section class="result is-hidden" id="result">
        <div class="preview">
          <div class="preview-art">
            <img id="videoThumb" alt="" width="176" height="99" />
            <span class="preview-length mono" id="videoDuration">00:00</span>
          </div>
          <div class="preview-copy">
            <h2 class="preview-title" id="videoTitle"></h2>
            <p class="preview-facts">
              <span id="videoChannel"></span>
              <span id="videoViews" class="mono"></span>
              <span id="videoDimensions" class="mono"></span>
            </p>
          </div>
        </div>

        <fieldset class="choice">
          <legend class="choice-legend">Save as</legend>
          <div class="segmented" id="formatGroup">
            <label class="segment">
              <input type="radio" name="format" value="mp4" checked />
              <svg aria-hidden="true"><use href="#i-video"/></svg>
              <span>Video<span class="segment-ext mono">MP4</span></span>
            </label>
            <label class="segment">
              <input type="radio" name="format" value="mp3" />
              <svg aria-hidden="true"><use href="#i-audio"/></svg>
              <span>Audio<span class="segment-ext mono">MP3</span></span>
            </label>
          </div>
        </fieldset>

        <fieldset class="choice">
          <legend class="choice-legend">Quality</legend>
          <div class="chips" id="qualityChips"></div>
        </fieldset>

        <div class="trim">
          <label class="switch">
            <input type="checkbox" id="trimToggle" />
            <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
            <span class="switch-copy">
              <span class="switch-label">Trim to a clip</span>
              <span class="switch-note">Save one section with full audio & HD quality.</span>
            </span>
          </label>

          <div class="trim-panel is-collapsed" id="trimPanel">
           <div class="trim-inner">
            <div class="stage" id="videoStage">
              <div id="ytPlayerContainer" class="stage-player"></div>
              <video id="previewVideo" class="stage-video is-hidden" playsinline preload="metadata"></video>
            </div>

            <div class="transport">
              <button type="button" id="playBtn" class="btn btn-ghost btn-icon" title="Play">
                <svg aria-hidden="true"><use href="#i-play" id="playIconUse"/></svg>
                <span class="sr-only">Play or pause the preview</span>
              </button>
              <button type="button" id="muteBtn" class="btn btn-ghost btn-icon" title="Unmute">
                <svg aria-hidden="true"><use href="#i-sound" id="muteIconUse"/></svg>
                <span class="sr-only">Mute or unmute the preview</span>
              </button>
              <p class="transport-time mono">
                <span id="currentTime">00:00</span><span class="transport-sep">/</span><span id="totalTime">00:00</span>
              </p>
              <button type="button" id="resetTrimBtn" class="btn btn-ghost">
                <svg aria-hidden="true"><use href="#i-reset"/></svg>
                <span>Whole video</span>
              </button>
            </div>

            <!-- Clip Scrubber & Playhead Seek Slider -->
            <div class="scrub-container">
              <div class="scrub-label-row">
                <span class="scrub-tip">🎚️ Scrub playhead:</span>
                <span id="playheadTime" class="mono scrub-time-badge">00:00:00</span>
              </div>
              <input type="range" id="seekSlider" class="seek-slider" min="0" max="1000" value="0" step="1" title="Scrub through the clip" />
            </div>

            <!-- Dual Range Trim Boundaries -->
            <div class="scrubber-wrap">
              <div class="scrub-label-row">
                <span class="scrub-tip">✂️ Trim Boundaries (Start / End):</span>
              </div>
              <div class="scrubber">
                <div class="scrubber-rail"></div>
                <div class="scrubber-range" id="trimRange"></div>
                <div class="scrubber-head" id="playhead"></div>
                <input type="range" id="trimStart" class="scrubber-input" min="0" max="1000" value="0" aria-label="Clip start" />
                <input type="range" id="trimEnd" class="scrubber-input" min="0" max="1000" value="1000" aria-label="Clip end" />
              </div>
            </div>

            <div class="times">
              <div class="time-field">
                <label for="startTime">Start</label>
                <input type="text" id="startTime" class="mono" value="00:00:00" inputmode="numeric" maxlength="8" />
                <button type="button" class="time-set" data-set="start">Set to playhead</button>
              </div>
              <div class="time-field">
                <label for="endTime">End</label>
                <input type="text" id="endTime" class="mono" value="00:00:00" inputmode="numeric" maxlength="8" />
                <button type="button" class="time-set" data-set="end">Set to playhead</button>
              </div>
              <p class="times-total">Clip length <strong class="mono" id="clipLength">00:00:00</strong></p>
            </div>
           </div>
          </div>
        </div>

        <div class="commit">
          <button type="button" id="downloadBtn" class="btn btn-solid btn-wide">
            <svg aria-hidden="true"><use href="#i-download"/></svg>
            <span id="downloadLabel">Download video</span>
            <span class="btn-meta mono" id="downloadSize"></span>
          </button>

          <div class="job is-hidden" id="job" aria-live="polite">
            <div class="job-head">
              <p class="job-text" id="jobText">Starting…</p>
              <p class="job-percent mono" id="jobPercent">0%</p>
            </div>
            <div class="job-track"><div class="job-fill" id="jobFill"></div></div>
            <div class="job-actions is-hidden" id="jobActions">
              <a class="btn btn-solid" id="jobSaveBtn" href="#" download>
                <svg aria-hidden="true"><use href="#i-download"/></svg>
                <span>Save the clip</span>
              </a>
              <button type="button" class="btn btn-ghost" id="jobDismissBtn">Done</button>
            </div>
          </div>
        </div>
      </section>

      <section class="recent is-hidden" id="recent">
        <div class="recent-head">
          <h2 class="recent-title-heading">
            <svg aria-hidden="true"><use href="#i-clock"/></svg>
            <span>Recent</span>
          </h2>
          <button type="button" class="btn btn-ghost btn-sm" id="clearRecentBtn">Clear</button>
        </div>
        <ul class="recent-list" id="recentList"></ul>
      </section>
    </main>

    <footer class="colophon">
      <p>YouTube Downloader • Fast, high-quality audio and video</p>
    </footer>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js?v=DEV"></script>
</body>
</html>
